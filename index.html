<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183f31">
  <title>MyDash · Performance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="src/ui/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main-content">ข้ามไปเนื้อหา</a>
  <div class="app-shell">
    <header class="app-header">
      <a href="#home" class="brand">MYDASH<span>PERFORMANCE</span></a>
      <div class="header-status"><span class="status-dot"></span><span id="connection-label">กำลังอ่านข้อมูล</span></div>
      <button id="reload-data" class="subtle-button">อ่านใหม่</button>
      <button id="cloud-login" class="subtle-button">เข้าสู่ระบบ</button>
    </header>
    <div id="data-notice" class="data-notice" role="status"></div>
    <main id="main-content" tabindex="-1"><div class="loading-state" role="status">กำลังอ่านข้อมูล MyDash…</div></main>
    <nav id="main-navigation" class="main-navigation" aria-label="เมนูหลัก">
      <a href="#home"><span>Home</span></a>
      <a href="#workouts"><span>Workouts</span></a>
      <a href="#health"><span>Health</span></a>
      <a href="#progress"><span>Progress</span></a>
      <a href="#more"><span>More</span></a>
    </nav>
  </div>
  <dialog id="goal-dialog" aria-labelledby="goal-title">
    <form id="goal-form">
      <div class="section-heading"><h2 id="goal-title">เป้าระยะประจำสัปดาห์</h2><button type="button" data-close-dialog class="subtle-button">ปิด</button></div>
      <p class="muted">เป้าหมายนี้บันทึกเฉพาะเบราว์เซอร์ในเครื่อง</p>
      <label>ระยะทาง (km)<input name="weeklyGoal" type="number" min="1" max="1000" step="0.1" required></label>
      <button class="button" type="submit">บันทึกเป้าหมาย</button><p class="form-status" role="status"></p>
    </form>
  </dialog>
  <script type="module" src="src/app.mjs"></script>
</body>
</html>
